<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280">
  <!-- 网页设计（浏览器窗口线稿） -->
  <rect width="400" height="280" fill="#eef4fb"/>
  <circle cx="352" cy="36" r="52" fill="#dce8fa"/>
  <circle cx="40" cy="250" r="60" fill="#e2edf9"/>

  <!-- 浏览器窗口 -->
  <rect x="36" y="36" width="328" height="208" rx="8" fill="#ffffff" stroke="#c5d2e5" stroke-width="2"/>
  <path d="M36,44 a8,8 0 0 1 8,-8 h312 a8,8 0 0 1 8,8 v18 h-328 Z" fill="#e7eef8"/>
  <circle cx="54" cy="49" r="4" fill="#e9635a"/>
  <circle cx="70" cy="49" r="4" fill="#f2b544"/>
  <circle cx="86" cy="49" r="4" fill="#7bd88f"/>
  <rect x="104" y="43" width="230" height="13" rx="6" fill="#ffffff" stroke="#d5dfeb" stroke-width="1"/>

  <!-- 页头：LOGO + 搜索框 -->
  <rect x="52" y="76" width="140" height="14" fill="#004098"/>
  <rect x="252" y="76" width="96" height="14" fill="#e3eaf5"/>
  <!-- 导航条 -->
  <rect x="52" y="98" width="296" height="12" fill="#3d6fd1"/>
  <!-- 横幅 -->
  <rect x="52" y="118" width="296" height="42" fill="#b8cfe8"/>
  <rect x="66" y="130" width="88" height="8" fill="#ffffff" opacity="0.85"/>
  <rect x="66" y="144" width="56" height="6" fill="#ffffff" opacity="0.6"/>
  <!-- 左栏 -->
  <rect x="52" y="170" width="176" height="58" fill="#f2f6fc" stroke="#dbe5f2" stroke-width="1"/>
  <rect x="62" y="180" width="80" height="7" fill="#004098"/>
  <rect x="62" y="194" width="156" height="5" fill="#c9d6ea"/>
  <rect x="62" y="204" width="140" height="5" fill="#c9d6ea"/>
  <rect x="62" y="214" width="120" height="5" fill="#c9d6ea"/>
  <!-- 右栏 -->
  <rect x="238" y="170" width="110" height="58" fill="#f2f6fc" stroke="#dbe5f2" stroke-width="1"/>
  <rect x="248" y="180" width="60" height="7" fill="#c8322b"/>
  <rect x="248" y="194" width="90" height="5" fill="#c9d6ea"/>
  <rect x="248" y="204" width="80" height="5" fill="#c9d6ea"/>
  <rect x="248" y="214" width="88" height="5" fill="#c9d6ea"/>
  <!-- 页脚 -->
  <rect x="52" y="234" width="296" height="7" fill="#c9d6e8"/>
