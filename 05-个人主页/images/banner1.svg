<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520">
  <!-- 轮播图1：晨光中的校园 -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b7d9f7"/>
      <stop offset="55%" stop-color="#e3f1fd"/>
      <stop offset="100%" stop-color="#fdf3da"/>
    </linearGradient>
    <linearGradient id="lawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8ec971"/>
      <stop offset="100%" stop-color="#5f9e52"/>
