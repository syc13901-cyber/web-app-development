    <circle cx="1435" cy="368" r="44" fill="#5c9a55"/>
    <circle cx="1478" cy="398" r="30" fill="#6fae62"/>
    <circle cx="1392" cy="398" r="28" fill="#4d8a49"/>
    <rect x="1298" y="402" width="12" height="44" fill="#7a5c43"/>
    <circle cx="1304" cy="382" r="34" fill="#6fae62"/>
