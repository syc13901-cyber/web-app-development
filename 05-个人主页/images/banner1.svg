  </defs>

  <!-- 天空与朝阳 -->
  <rect width="1600" height="520" fill="url(#sky)"/>
  <circle cx="1290" cy="95" r="60" fill="#ffd873" opacity="0.25"/>
  <circle cx="1290" cy="95" r="40" fill="#ffd873" opacity="0.9"/>

  <!-- 远山 -->
  <path d="M0,430 Q180,320 400,410 T820,390 T1240,420 T1600,395 L1600,440 L0,440 Z" fill="#aac6e2"/>
  <path d="M0,440 Q320,360 640,430 T1180,420 T1600,435 L1600,460 L0,460 Z" fill="#8fb3d6" opacity="0.85"/>

  <!-- 草坪 -->
  <rect x="0" y="430" width="1600" height="90" fill="url(#lawn)"/>

  <!-- 中央大道 -->
