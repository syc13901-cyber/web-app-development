    <rect x="638" y="406" width="16" height="20"/><rect x="662" y="406" width="16" height="20"/>
    <rect x="928" y="406" width="16" height="20"/><rect x="958" y="406" width="16" height="20"/>
    <rect x="988" y="406" width="16" height="20"/><rect x="1012" y="406" width="16" height="20"/>
