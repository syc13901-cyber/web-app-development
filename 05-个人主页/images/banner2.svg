<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520">
  <!-- 轮播图2：金黄的银杏大道 -->
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdf6e3"/>
      <stop offset="100%" stop-color="#fbe3b3"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="520" fill="url(#sky2)"/>
  <circle cx="240" cy="110" r="58" fill="#ffdf9e" opacity="0.2"/>
  <circle cx="240" cy="110" r="36" fill="#ffdf9e" opacity="0.85"/>

  <!-- 地面 -->
  <rect x="0" y="400" width="1600" height="120" fill="#e6cfa0"/>
  <!-- 银杏大道 -->
  <polygon points="640,400 960,400 1180,520 420,520" fill="#dcc48f"/>
  <polygon points="786,430 814,430 830,520 770,520" fill="#cbb37e" opacity="0.6"/>

  <!-- 大道尽头的远树 -->
  <g fill="#d9b26a" opacity="0.65">
    <circle cx="760" cy="392" r="22"/><circle cx="808" cy="396" r="16"/><circle cx="850" cy="392" r="20"/>
  </g>

  <!-- 左侧银杏 -->
  <g>
    <rect x="442" y="330" width="14" height="84" fill="#8a6a4a"/>
    <circle cx="449" cy="300" r="52" fill="#f5b942"/>
    <circle cx="405" cy="330" r="36" fill="#eda320"/>
    <circle cx="494" cy="332" r="38" fill="#f8ce6d"/>
    <circle cx="449" cy="262" r="30" fill="#f2b544"/>
    <rect x="560" y="356" width="12" height="60" fill="#8a6a4a"/>
    <circle cx="566" cy="332" r="40" fill="#f8ce6d"/>
    <circle cx="532" cy="356" r="26" fill="#eda320"/>
    <circle cx="598" cy="354" r="26" fill="#f5b942"/>
    <rect x="620" y="378" width="10" height="44" fill="#8a6a4a"/>
    <circle cx="625" cy="360" r="30" fill="#f2b544"/>
    <circle cx="598" cy="378" r="20" fill="#eda320"/>
  </g>

  <!-- 右侧银杏 -->
  <g>
    <rect x="1144" y="330" width="14" height="84" fill="#8a6a4a"/>
    <circle cx="1151" cy="300" r="52" fill="#f5b942"/>
    <circle cx="1195" cy="330" r="36" fill="#eda320"/>
    <circle cx="1106" cy="332" r="38" fill="#f8ce6d"/>
    <circle cx="1151" cy="262" r="30" fill="#f2b544"/>
    <rect x="1028" y="356" width="12" height="60" fill="#8a6a4a"/>
    <circle cx="1034" cy="332" r="40" fill="#f8ce6d"/>
    <circle cx="1068" cy="356" r="26" fill="#eda320"/>
    <circle cx="1002" cy="354" r="26" fill="#f5b942"/>
    <rect x="970" y="378" width="10" height="44" fill="#8a6a4a"/>
    <circle cx="975" cy="360" r="30" fill="#f2b544"/>
    <circle cx="1002" cy="378" r="20" fill="#eda320"/>
  </g>

  <!-- 飘落的银杏叶 -->
  <g fill="#f2b544">
    <ellipse cx="700" cy="180" rx="7" ry="3.5" transform="rotate(30 700 180)"/>
    <ellipse cx="860" cy="150" rx="6" ry="3" transform="rotate(-20 860 150)"/>
    <ellipse cx="1000" cy="210" rx="7" ry="3.5" transform="rotate(45 1000 210)"/>
    <ellipse cx="760" cy="260" rx="6" ry="3" transform="rotate(-40 760 260)"/>
    <ellipse cx="920" cy="300" rx="7" ry="3.5" transform="rotate(15 920 300)"/>
    <ellipse cx="560" cy="240" rx="6" ry="3" transform="rotate(-15 560 240)"/>
    <ellipse cx="1050" cy="150" rx="6" ry="3" transform="rotate(30 1050 150)"/>
    <ellipse cx="810" cy="340" rx="6" ry="3" transform="rotate(-30 810 340)"/>
  </g>
  <g fill="#e8a02e">
    <ellipse cx="640" cy="220" rx="6" ry="3" transform="rotate(25 640 220)"/>
    <ellipse cx="950" cy="170" rx="6" ry="3" transform="rotate(-35 950 170)"/>
    <ellipse cx="880" cy="250" rx="5" ry="2.5" transform="rotate(50 880 250)"/>
    <ellipse cx="720" cy="310" rx="6" ry="3" transform="rotate(-10 720 310)"/>
  </g>
</svg>
