<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>带即时校验的用户注册程序</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: #eef0f4;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 20px;
  }

  .page {
    display: flex;
    gap: 24px;
    align-items: flex-start;
    width: 980px;
  }

  /* ---------- 左侧：校验规则 ---------- */
  .rules {
    width: 300px;
    background: #f7f8fa;
    border: 1px solid #e6e9ef;
    border-radius: 10px;
    padding: 20px 24px 24px;
  }
  .rules h2 {
    font-size: 18px;
    color: #b91c1c;
    margin-bottom: 14px;
  }
  .rules ul { list-style: none; }
  .rules li {
    position: relative;
    padding-left: 16px;
    margin-bottom: 11px;
    font-size: 13.5px;
    line-height: 1.6;
    color: #444;
  }
  .rules li::before {
    content: "";
    position: absolute;
    left: 0;
    top: 8px;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #b91c1c;
  }

  /* ---------- 右侧：注册表单卡片 ---------- */
  .card {
    flex: 1;
    background: #fff;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 8px 24px rgba(30, 41, 59, .12);
  }
  .card-header {
    background: linear-gradient(135deg, #6d28d9 0%, #4f46e5 55%, #2563eb 100%);
    color: #fff;
    text-align: center;
    padding: 18px 20px 16px;
  }
  .card-header h1 { font-size: 21px; font-weight: 700; letter-spacing: 2px; }
  .card-header p  { margin-top: 6px; font-size: 11.5px; opacity: .88; }

  form { padding: 22px 26px 26px; }

  .row {
    display: flex;
    gap: 12px;
    margin-bottom: 6px;
    align-items: flex-start;
  }
  .row > label {
    width: 84px;
    flex-shrink: 0;
    text-align: right;
    font-size: 14px;
    font-weight: 700;
    color: #333;
    padding-top: 10px;
  }

  .field { flex: 1; }

  .input-wrap { position: relative; }
  .input-wrap input {
    width: 100%;
    height: 38px;
    border: 1.5px solid #a78bfa;      /* 默认：紫色边框（与界面示意一致） */
    border-radius: 6px;
    padding: 0 34px 0 10px;
    font-size: 13px;
    color: #333;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .input-wrap input:focus {
    box-shadow: 0 0 0 3px rgba(109, 40, 217, .12);
  }

  /* 右侧状态图标：✗ / ✓ */
  .status {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 15px;
    font-weight: 700;
    line-height: 1;
    pointer-events: none;
  }

  /* 字段下方提示文字（预留高度，避免行高跳动） */
  .msg {
    min-height: 18px;
    margin-top: 3px;
    font-size: 12px;
    line-height: 1.4;
    color: #dc2626;
  }

  /* 校验状态：valid 绿色 / invalid 红色 */
  .field.valid   .input-wrap input { border-color: #22c55e; }
  .field.valid   .status            { color: #22c55e; }
  .field.invalid .input-wrap input  { border-color: #ef4444; }
  .field.invalid .status            { color: #ef4444; }

  /* ---------- 提交按钮与整体提示 ---------- */
  .submit {
    width: 100%;
    height: 42px;
    margin-top: 10px;
    border: none;
    border-radius: 6px;
    background: linear-gradient(135deg, #6d28d9, #2563eb);
    color: #fff;
    font-size: 15px;
    letter-spacing: 4px;
    cursor: pointer;
  }
  .submit:hover { opacity: .92; }

  .form-msg {
    margin-top: 12px;
    text-align: center;
    font-size: 13px;
    min-height: 20px;
  }
  .form-msg.ok  { color: #16a34a; }
  .form-msg.err { color: #dc2626; }
</style>
</head>
<body>

<div class="page">
  <!-- 左侧规则说明 -->
  <div class="rules">
    <h2>校验规则</h2>
    <ul>
      <li>用户名：必须以字母开头，长度 6–20</li>
      <li>不得以数字、下划线 _ 或 $ 开头</li>
      <li>密码：不得与用户名相同，长度 6–20</li>
      <li>邮箱：须符合电子邮件基本语法</li>
      <li>建议：用正则表达式完成格式判断</li>
      <li>错误时在项目右侧标签显示提示</li>
    </ul>
  </div>

  <!-- 右侧注册表单 -->
  <div class="card">
    <div class="card-header">
      <h1>用户注册表单</h1>
      <p>请填写以下信息完成注册，系统将实时验证输入内容</p>
    </div>

    <form id="regForm" novalidate>
      <div class="row">
        <label for="username">用户名：</label>
        <div class="field">
          <div class="input-wrap">
            <input id="username" name="username" type="text" placeholder="6–20 位，以字母开头" autocomplete="off">
            <span class="status"></span>
          </div>
          <p class="msg"></p>
        </div>
      </div>

      <div class="row">
        <label for="password">密码：</label>
        <div class="field">
          <div class="input-wrap">
            <input id="password" name="password" type="password" placeholder="6–20 位，不能与用户名相同" autocomplete="new-password">
            <span class="status"></span>
          </div>
          <p class="msg"></p>
        </div>
      </div>

      <div class="row">
        <label for="confirm">确认密码：</label>
        <div class="field">
          <div class="input-wrap">
            <input id="confirm" name="confirm" type="password" placeholder="请再次输入密码" autocomplete="new-password">
            <span class="status"></span>
          </div>
          <p class="msg"></p>
        </div>
      </div>

      <div class="row">
        <label for="email">邮件地址：</label>
        <div class="field">
          <div class="input-wrap">
            <input id="email" name="email" type="email" placeholder="例如：name@example.com" autocomplete="off">
            <span class="status"></span>
          </div>
          <p class="msg"></p>
        </div>
      </div>

      <button class="submit" type="submit">注 册</button>
      <p id="formMsg" class="form-msg"></p>
    </form>
  </div>
</div>

<script>
(function () {
  'use strict';

  var form = document.getElementById('regForm');
  var formMsg = document.getElementById('formMsg');
  var usernameInput = document.getElementById('username');
  var passwordInput = document.getElementById('password');
  var confirmInput  = document.getElementById('confirm');
  var emailInput    = document.getElementById('email');

  var inputs = {
    username: usernameInput,
    password: passwordInput,
    confirm:  confirmInput,
    email:    emailInput
  };

  /* ---------- 校验规则：全部用正则表达式判断，返回错误信息（空串 = 通过） ---------- */
  var rules = {
    username: function (v) {
      if (v === '')  return '用户名不能为空';
      if (!/^[A-Za-z]/.test(v))
        return '用户名必须以字母开头，不能以数字、下划线 _ 或 $ 开头';
      if (!/^[A-Za-z][A-Za-z0-9_$]*$/.test(v))
        return '用户名只能包含字母、数字、下划线 _ 和 $';
      if (v.length < 6 || v.length > 20)
        return '用户名长度须为 6–20 个字符';
      return '';
    },
    password: function (v) {
      if (v === '') return '密码不能为空';
      if (!/^.{6,20}$/.test(v))
        return '密码长度须为 6–20 个字符';
      if (v === usernameInput.value.trim())
        return '密码不能与用户名相同';
      return '';
    },
    confirm: function (v) {
      if (v === '') return '请再次输入密码';
      if (v !== passwordInput.value)
        return '两次输入的密码不一致';
      return '';
    },
    email: function (v) {
      if (v === '') return '邮件地址不能为空';
      if (!/^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/.test(v))
        return '请输入有效的电子邮件地址';
      return '';
    }
  };

  /* ---------- 显示校验结果：右侧 ✗/✓ 图标 + 下方红色提示 + 边框颜色 ---------- */
  function setState(name, ok, msg) {
    var field  = inputs[name].closest('.field');
    var status = field.querySelector('.status');
    field.classList.toggle('valid',   ok);
    field.classList.toggle('invalid', !ok);
    status.textContent = ok ? '✓' : '✗';
    field.querySelector('.msg').textContent = msg;
  }

  var touched = { username: false, password: false, confirm: false, email: false };

  function validate(name) {
    var msg = rules[name](inputs[name].value.trim());
    setState(name, msg === '', msg);
    touched[name] = true;
    return msg === '';
  }

  /* ---------- 事件绑定：失焦校验 + 已校验过的字段输入时即时更新 ---------- */
  Object.keys(inputs).forEach(function (name) {
    inputs[name].addEventListener('blur', function () {
      validate(name);
    });
    inputs[name].addEventListener('input', function () {
      if (touched[name]) validate(name);                 // 即时反馈：输入过程中同步校验
      if (name === 'username' && touched.password) validate('password'); // 密码规则依赖用户名
      if (name === 'password' && touched.confirm)  validate('confirm');  // 确认密码依赖密码
    });
  });

  /* ---------- 提交：全部通过才"提交" ---------- */
  form.addEventListener('submit', function (e) {
    e.preventDefault();                                   // 阻止整页提交，改为前端校验
    var allOk = true;
    var firstInvalid = null;
    Object.keys(inputs).forEach(function (name) {
      var ok = validate(name);
      if (!ok) {
        allOk = false;
        if (!firstInvalid) firstInvalid = inputs[name];
      }
    });
    if (allOk) {
      formMsg.textContent = '✓ 全部校验通过，注册信息已提交（演示环境不会真正发送）';
      formMsg.className = 'form-msg ok';
    } else {
      formMsg.textContent = '✗ 请先修正上方标红的内容再提交';
      formMsg.className = 'form-msg err';
      if (firstInvalid) firstInvalid.focus();
    }
  });
})();
</script>
</body>
</html>
